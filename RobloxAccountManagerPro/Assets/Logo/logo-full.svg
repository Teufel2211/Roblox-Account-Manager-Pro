<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="1024" height="256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="256" fill="#0F172A"/>

  <!-- Logo Icon (Left) -->
  <g transform="translate(80, 60)">
    <!-- Shield -->
    <path d="M 60 0 L 20 25 L 20 80 Q 20 120 60 150 Q 100 120 100 80 L 100 25 Z" 
          fill="none" stroke="url(#grad1)" stroke-width="2"/>
    <!-- Users -->
    <circle cx="60" cy="55" r="8" fill="none" stroke="url(#grad1)" stroke-width="1.5"/>
    <path d="M 52 68 Q 52 72 60 75 Q 68 72 68 68" fill="none" stroke="url(#grad1)" stroke-width="1.5"/>
  </g>

  <!-- Text -->
  <text x="280" y="130" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#06B6D4">
    ROBLOX AMP
  </text>
  
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="32" fill="#94A3B8">
    Manage. Launch. Secure.
  </text>

  <!-- Accent Line -->
  <line x1="280" y1="190" x2="580" y2="190" stroke="#06B6D4" stroke-width="2" opacity="0.5"/>
</svg>
