<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#0F172A"/>

  <!-- Shield Shape -->
  <path d="M 128 30 L 85 55 L 85 120 Q 85 160 128 200 Q 171 160 171 120 L 171 55 Z" 
        fill="none" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>

  <!-- Shield Fill (semi-transparent) -->
  <path d="M 128 30 L 85 55 L 85 120 Q 85 160 128 200 Q 171 160 171 120 L 171 55 Z" 
        fill="#06B6D4" opacity="0.1"/>

  <!-- User Icons (3 stacked) -->
  <g filter="url(#glow)">
    <!-- Top User -->
    <circle cx="128" cy="80" r="12" fill="none" stroke="url(#grad1)" stroke-width="2"/>
    <path d="M 116 95 Q 116 100 128 105 Q 140 100 140 95" 
          fill="none" stroke="url(#grad1)" stroke-width="2"/>
    
    <!-- Middle User -->
    <circle cx="128" cy="125" r="12" fill="none" stroke="url(#grad1)" stroke-width="2"/>
    <path d="M 116 140 Q 116 145 128 150 Q 140 145 140 140" 
          fill="none" stroke="url(#grad1)" stroke-width="2"/>
  </g>

  <!-- Cube Element (bottom right) -->
  <g filter="url(#glow)" opacity="0.8">
    <rect x="150" y="155" width="35" height="35" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <line x1="150" y1="155" x2="165" y2="145"/>
    <line x1="185" y1="155" x2="200" y2="145"/>
    <line x1="165" y1="145" x2="200" y2="145"/>
    <rect x="165" y="145" width="35" height="35" fill="none" stroke="#94A3B8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Center Circle Accent -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.3"/>
  <circle cx="128" cy="128" r="75" fill="none" stroke="#06B6D4" stroke-width="0.5" opacity="0.2" stroke-dasharray="5,5"/>
</svg>
